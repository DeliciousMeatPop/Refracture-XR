[package]
name = "refract-launcher"
version = "1.0.1"
description = "Refract desktop launcher"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[features]
# Serve the bundled UI instead of the dev server; `tauri build` turns it on, a plain `cargo build --release --features custom-protocol` too.
custom-protocol = ["tauri/custom-protocol"]
